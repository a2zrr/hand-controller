[project]
name = "hand-controller"
version = "0.1.0"
description = "Control any app or game with hand gestures from a webcam. Sends RIGHT, LEFT, UP, DOWN and STOP over UDP."
license = "MIT"
license-files = ["LICENSE"]
keywords = ["hand-tracking", "gesture-recognition", "webcam", "mediapipe", "udp", "game-controller", "accessibility", "computer-vision"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 0.10.x is the stable line. MediaPipe needs the contrib build of OpenCV.
    "mediapipe>=0.10.35,<0.11",
    # Depend on the contrib build directly so cv2 is always present. Never add opencv-python:
    # both packages install a cv2 module and break each other.
    "opencv-contrib-python>=4.10",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.scripts]
hand-controller = "hand_controller.app:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hand_controller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
